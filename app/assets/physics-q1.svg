<svg xmlns="http://www.w3.org/2000/svg" viewBox="20 140 900 110"><rect width="1200" height="900" fill="#fff"/><rect width="1200" height="110" fill="#5B2C83"/><text x="50" y="72" font-family="Calibri, Carlito, Arial, Helvetica, sans-serif" font-size="54" font-weight="700" fill="#fff" text-anchor="start">Starter: Density</text><text x="1150" y="72" font-family="Calibri, Carlito, Arial, Helvetica, sans-serif" font-size="34" font-weight="400" fill="#fff" text-anchor="end">5 minutes</text><text x="60" y="210" font-family="Calibri, Carlito, Arial, Helvetica, sans-serif" font-size="38" font-weight="700" fill="#5B2C83" text-anchor="start">1.</text><text x="112" y="210" font-family="Calibri, Carlito, Arial, Helvetica, sans-serif" font-size="38" font-weight="400" fill="#222" text-anchor="start">Write down the equation for density.</text><text x="60" y="330" font-family="Calibri, Carlito, Arial, Helvetica, sans-serif" font-size="38" font-weight="700" fill="#5B2C83" text-anchor="start">2.</text><text x="112" y="330" font-family="Calibri, Carlito, Arial, Helvetica, sans-serif" font-size="38" font-weight="400" fill="#222" text-anchor="start">A block has a mass of 200 g and a</text><text x="112" y="380" font-family="Calibri, Carlito, Arial, Helvetica, sans-serif" font-size="38" font-weight="400" fill="#222" text-anchor="start">volume of 50 cm³. Calculate its density.</text><g transform="translate(930 270)" stroke="#333" stroke-width="3" stroke-linejoin="round"><polygon points="0,60 140,60 140,190 0,190" fill="#C9B6DD"/><polygon points="0,60 50,10 190,10 140,60" fill="#E3D7EE"/><polygon points="140,60 190,10 190,140 140,190" fill="#A88CC4"/></g><text x="1000" y="505" font-family="Calibri, Carlito, Arial, Helvetica, sans-serif" font-size="30" font-weight="700" fill="#333" text-anchor="middle">200 g</text><text x="1000" y="545" font-family="Calibri, Carlito, Arial, Helvetica, sans-serif" font-size="30" font-weight="400" fill="#333" text-anchor="middle">50 cm³</text><text x="60" y="560" font-family="Calibri, Carlito, Arial, Helvetica, sans-serif" font-size="38" font-weight="700" fill="#5B2C83" text-anchor="start">3.</text><text x="112" y="560" font-family="Calibri, Carlito, Arial, Helvetica, sans-serif" font-size="38" font-weight="400" fill="#222" text-anchor="start">Explain why ice floats on water.</text><rect x="50" y="650" width="1100" height="190" rx="18" fill="#F6F1FA" stroke="#5B2C83" stroke-width="3" stroke-dasharray="12 10"/><text x="90" y="715" font-family="Calibri, Carlito, Arial, Helvetica, sans-serif" font-size="34" font-weight="700" fill="#5B2C83" text-anchor="start">Extension</text><text x="90" y="765" font-family="Calibri, Carlito, Arial, Helvetica, sans-serif" font-size="36" font-weight="400" fill="#222" text-anchor="start">Describe how you would find the density of an</text><text x="90" y="810" font-family="Calibri, Carlito, Arial, Helvetica, sans-serif" font-size="36" font-weight="400" fill="#222" text-anchor="start">irregularly shaped stone.</text></svg>
